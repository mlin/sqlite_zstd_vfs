name: tests
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: deps
      run: |
        sudo apt-get -qq update
        sudo apt-get install -y clang-format cppcheck python3-pip python3-venv
        python3 -m venv "$HOME/.lint-venv"
        "$HOME/.lint-venv/bin/pip" install pre-commit ruff
        echo "$HOME/.lint-venv/bin" >> "$GITHUB_PATH"
    - name: pre-commit
      run: pre-commit run --all-files
  ctest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        BUILD_TYPE: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: docker build
      run: sudo docker build -t tests --build-arg build_type=${{ matrix.BUILD_TYPE }} .
    - name: run tests
      run: sudo docker run tests
  macOS:
    runs-on: macos-15
    strategy:
      matrix:
        BUILD_TYPE: [Debug, Release]
    steps:
    - uses: actions/checkout@v7
    - name: dependencies
      run: |
        brew install python sqlite zstd samtools aria2
        $(brew --prefix)/bin/pip3 install --break-system-packages pytest pytest-xdist
        # test web_vfs using the older system libcurl
        brew uninstall --ignore-dependencies curl
        curl --version
        which curl
        otool -L $(which curl)
    - name: build
      run: |
        CXXFLAGS="-I$(brew --prefix)/include -I$(brew --prefix)/opt/sqlite/include" \
        LDFLAGS="-L$(brew --prefix)/lib -L$(brew --prefix)/opt/sqlite/lib" \
          cmake -DCMAKE_BUILD_TYPE=${{ matrix.BUILD_TYPE }} \
                -DCMAKE_PREFIX_PATH=$(brew --prefix)/opt/sqlite \
                -B build .
        cmake --build build -j 4
    - name: ctest
      run: |
        export PREFIX=$(brew --prefix)
        export PATH=$(ls -p1 ${PREFIX}/opt/python@*)/bin:${PREFIX}/opt/sqlite/bin:$PATH
        cd build
        ctest -V
