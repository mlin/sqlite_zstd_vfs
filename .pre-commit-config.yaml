repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    verbose: true
    entry: clang-format
    args: [-i,'-style={IndentWidth: 4, ColumnLimit: 100}']
  - id: cppcheck
    name: cppcheck
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    verbose: true
    entry: cppcheck
    args: [-q,--language=c++]
  - id: ruff-check
    name: ruff-check
    language: system
    types: [python]
    verbose: true
    entry: ruff check
  - id: ruff-format
    name: ruff-format
    language: system
    types: [python]
    verbose: true
    entry: ruff format
