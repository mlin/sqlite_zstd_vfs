repos:
- repo: local
  hooks:
  - id: clang-format
    name: clang-format
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    verbose: true
    entry: clang-format
    args: [-i,'-style={IndentWidth: 4, ColumnLimit: 100}']
  - id: cppcheck
    name: cppcheck
    language: system
    files: \.(c|cc|cxx|cpp|h|hpp|hxx)$
    verbose: true
    entry: cppcheck
    args: [-q,--language=c++]
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff-check
    name: ruff-check
    verbose: true
  - id: ruff-format
    name: ruff-format
    verbose: true
